services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodlabel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - haccp_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: foodlabel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - haccp_net
    depends_on:
      - app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodlabel_worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - haccp_net
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodlabel_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - haccp_net
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: foodlabel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodlabel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-foodlabel_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - haccp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodlabel_user -d foodlabel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodlabel_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - haccp_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: foodlabel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@foodlabel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - haccp_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  haccp_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
